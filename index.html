<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Verificación de correo · Sindry POS</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f2ea;color:#222b24;font:16px/1.55 system-ui,sans-serif}main{width:min(100%,490px);overflow:hidden;border-radius:22px;background:white;border:1px solid #d9d6cc;box-shadow:0 12px 35px #20281212}header{padding:22px 32px;background:#252e26;color:white;font-size:23px;font-weight:750}header b{color:#ffa46b}section{padding:32px}h1{line-height:1.12;letter-spacing:-.04em;margin:0;font-size:clamp(28px,6vw,38px)}p{color:#4b574d;margin-bottom:0}
</style></head><body><main><header>Sindry <b>POS</b></header><section aria-live="polite"><h1 id="title">Verificación de correo</h1><p id="message">Abre el enlace que recibiste por correo para confirmar tu registro en Sindry POS.</p></section></main>
<script>
const hash = new URLSearchParams(location.hash.slice(1));
const query = new URLSearchParams(location.search);
history.replaceState(null,"",location.pathname);
async function verify() {
  let title, message;
  if (hash.has("error") || query.has("error")) {
    title="El enlace no está disponible";
    message="Si ya confirmaste, inicia sesión en Sindry POS. Si aún no puedes entrar, solicita otro correo desde la app.";
  } else if (hash.has("access_token")) {
    try {
      const response=await fetch("https://nytyyxsgnljinsplkbii.supabase.co/auth/v1/user",{headers:{apikey:"sb_publishable_WT9eymSWYMYcYjAd8W-WkQ_brNNGOeX",Authorization:"Bearer "+hash.get("access_token")},cache:"no-store",referrerPolicy:"no-referrer"});
      if (!response.ok || !(await response.json()).email_confirmed_at) throw Error();
      title="Correo confirmado";
      message="Puedes cerrar esta página y regresar a Sindry POS. Inicia sesión en la app para consultar el acceso de tu negocio.";
    } catch {
      title="Consulta tu registro en la app";
      message="No pudimos comprobar el estado de tu cuenta. Abre Sindry POS e inicia sesión para verificarlo.";
    }
  } else return;
  document.getElementById("title").textContent=title;
  document.getElementById("message").textContent=message;
}
verify();
</script></body></html>
